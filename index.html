<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>.card {
    width: 300px;
    padding: 20px;
    background-color: rgb(248, 243, 243);
    border: 1px solid #4a4a4a;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.card h2 {
    margin-bottom: 10px;
}

.card button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}</style>


</head>
<body>
    <div class="card">
    <h2>John Doe</h2>
    <p>Web Developer</p>
    <button>View Profile</button>
</div>
</body>
</html>
